<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1904" viewBox="0 0 1200 1904" role="img" aria-label="Arko Click architecture diagram">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F2EFE9" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#F2EFE9" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#FF3B00"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#F2EFE9" fill-opacity=".55"/>
    </marker>
  </defs>

  <rect width="1200" height="1904" fill="#0B0B0B"/>
  <rect width="1200" height="1904" fill="url(#grid)"/>
  <rect width="1200" height="1904" fill="url(#gridBig)"/>
  <rect x="32" y="32" width="1136" height="1840" fill="none" stroke="#F2EFE9" stroke-opacity=".16"/>

  <g font-family="monospace" fill="#F2EFE9">
    <text x="64" y="92" font-size="17" letter-spacing="4" fill-opacity=".62">ARKO CLICK / SYSTEM MAP</text>
    <text x="1136" y="92" font-size="17" letter-spacing="4" text-anchor="end" fill="#FF3B00">REV 2.4 / MIT</text>
    <line x1="64" y1="118" x2="1136" y2="118" stroke="#F2EFE9" stroke-opacity=".22"/>

    <text x="64" y="240" font-family="Arial Black, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="-3">NATIVE</text>
    <text x="64" y="326" font-family="Arial Black, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="-3">WINDOW</text>
    <text x="64" y="412" font-family="Arial Black, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="-3" fill="#FF3B00">CONTROL.</text>
    <text x="64" y="466" font-size="18" letter-spacing="2" fill-opacity=".66">DIRECT WIN32 DISPATCH / NO CURSOR THEFT / ZERO IDLE CPU</text>
    <line x1="64" y1="500" x2="1136" y2="500" stroke="#FF3B00" stroke-width="2"/>

    <!-- 01 Win32 hook layer -->
    <g>
      <rect x="64" y="548" width="456" height="250" fill="#111111" stroke="#F2EFE9" stroke-opacity=".24"/>
      <rect x="64" y="548" width="456" height="4" fill="#FF3B00"/>
      <text x="88" y="592" font-size="16" letter-spacing="3" fill="#FF3B00">01 / WIN32 HOOK LAYER</text>
      <text x="88" y="634" font-size="22" letter-spacing="1">ENUMWINDOWS</text>
      <text x="88" y="674" font-size="22" letter-spacing="1">ISWINDOWVISIBLE</text>
      <text x="88" y="714" font-size="22" letter-spacing="1">GETWINDOWRECT</text>
      <text x="88" y="762" font-size="15" letter-spacing="1" fill-opacity=".5">FINDS HIDDEN + COVERED TARGETS</text>
    </g>

    <!-- 02 Rust scheduler -->
    <g>
      <rect x="680" y="548" width="456" height="250" fill="#111111" stroke="#F2EFE9" stroke-opacity=".24"/>
      <rect x="680" y="548" width="456" height="4" fill="#FF3B00"/>
      <text x="704" y="592" font-size="16" letter-spacing="3" fill="#FF3B00">02 / RUST SCHEDULER</text>
      <text x="704" y="634" font-size="22" letter-spacing="1">TOKEN BUCKET LOOP</text>
      <text x="704" y="674" font-size="22" letter-spacing="1">EVENT DRIVEN WAKE</text>
      <text x="704" y="714" font-size="22" letter-spacing="1">0 PERCENT IDLE LOAD</text>
      <text x="704" y="762" font-size="15" letter-spacing="1" fill-opacity=".5">NO BUSY POLLING / NO BACKGROUND SPIN</text>
    </g>

    <!-- bridge -->
    <g>
      <line x1="520" y1="650" x2="680" y2="650" stroke="#FF3B00" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="680" y1="700" x2="520" y2="700" stroke="#F2EFE9" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrowMuted)"/>
      <text x="600" y="630" font-size="14" letter-spacing="2" text-anchor="middle" fill="#FF3B00">DISPATCH</text>
      <text x="600" y="728" font-size="14" letter-spacing="2" text-anchor="middle" fill-opacity=".55">RESULT</text>
    </g>

    <!-- 03 egui control -->
    <g>
      <rect x="64" y="870" width="456" height="250" fill="#111111" stroke="#F2EFE9" stroke-opacity=".24"/>
      <rect x="64" y="870" width="456" height="4" fill="#FF3B00"/>
      <text x="88" y="914" font-size="16" letter-spacing="3" fill="#FF3B00">03 / EGUI CONTROL PANEL</text>
      <text x="88" y="956" font-size="22" letter-spacing="1">BILINGUAL RTL + EN</text>
      <text x="88" y="996" font-size="22" letter-spacing="1">PROFILE SWITCHER</text>
      <text x="88" y="1036" font-size="22" letter-spacing="1">TRAY + HOTKEY BINDINGS</text>
      <text x="88" y="1084" font-size="15" letter-spacing="1" fill-opacity=".5">NO CONSOLE REQUIRED IN PRODUCTION</text>
    </g>

    <!-- 04 auto update -->
    <g>
      <rect x="680" y="870" width="456" height="250" fill="#111111" stroke="#F2EFE9" stroke-opacity=".24"/>
      <rect x="680" y="870" width="456" height="4" fill="#FF3B00"/>
      <text x="704" y="914" font-size="16" letter-spacing="3" fill="#FF3B00">04 / SHIP + UPDATE</text>
      <text x="704" y="956" font-size="22" letter-spacing="1">INNO SETUP INSTALLER</text>
      <text x="704" y="996" font-size="22" letter-spacing="1">SIGNED MANIFEST</text>
      <text x="704" y="1036" font-size="22" letter-spacing="1">DELTA PATCH CHANNEL</text>
      <text x="704" y="1084" font-size="15" letter-spacing="1" fill-opacity=".5">SILENT UPDATE / ROLLBACK SAFE</text>
    </g>

    <!-- vertical flow -->
    <g>
      <line x1="292" y1="798" x2="292" y2="870" stroke="#FF3B00" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="908" y1="798" x2="908" y2="870" stroke="#FF3B00" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <!-- sequence -->
    <g>
      <text x="64" y="1200" font-size="16" letter-spacing="3" fill-opacity=".6">EXECUTION TRACE</text>
      <line x1="64" y1="1240" x2="1136" y2="1240" stroke="#F2EFE9" stroke-opacity=".22"/>
      <g font-size="17" letter-spacing="1">
        <circle cx="92" cy="1240" r="6" fill="#FF3B00"/>
        <text x="92" y="1280" text-anchor="middle" fill-opacity=".8">ENUMERATE</text>
        <circle cx="356" cy="1240" r="6" fill="#FF3B00"/>
        <text x="356" y="1280" text-anchor="middle" fill-opacity=".8">MATCH</text>
        <circle cx="620" cy="1240" r="6" fill="#FF3B00"/>
        <text x="620" y="1280" text-anchor="middle" fill-opacity=".8">DISPATCH</text>
        <circle cx="884" cy="1240" r="6" fill="#FF3B00"/>
        <text x="884" y="1280" text-anchor="middle" fill-opacity=".8">VERIFY</text>
        <circle cx="1108" cy="1240" r="6" fill="#F2EFE9" fill-opacity=".55"/>
        <text x="1108" y="1280" text-anchor="middle" fill-opacity=".55">LOG</text>
      </g>
      <text x="64" y="1340" font-size="15" letter-spacing="1" fill-opacity=".46">POSTMESSAGE CARRIES WM_CLOSE / WM_SETTEXT WITHOUT MOVING THE POINTER.</text>
    </g>

    <line x1="64" y1="1404" x2="1136" y2="1404" stroke="#F2EFE9" stroke-opacity=".22"/>
    <text x="64" y="1444" font-size="16" letter-spacing="3" fill-opacity=".6">CONSTRAINTS / VERIFIED</text>

    <g>
      <text x="64" y="1512" font-size="16" letter-spacing="2" fill="#FF3B00">01 / INPUT</text>
      <text x="64" y="1552" font-size="24" letter-spacing="1">NO CURSOR MOVEMENT</text>
      <text x="64" y="1582" font-size="14" letter-spacing="1" fill-opacity=".46">THE POINTER NEVER LEAVES ITS POSITION</text>

      <text x="430" y="1512" font-size="16" letter-spacing="2" fill="#FF3B00">02 / FOCUS</text>
      <text x="430" y="1552" font-size="24" letter-spacing="1">NO FOREGROUND STEAL</text>
      <text x="430" y="1582" font-size="14" letter-spacing="1" fill-opacity=".46">TARGET WINDOW STAYS IN PLACE</text>

      <text x="796" y="1512" font-size="16" letter-spacing="2" fill="#FF3B00">03 / ACCESS</text>
      <text x="796" y="1552" font-size="24" letter-spacing="1">NO ADMIN BY DEFAULT</text>
      <text x="796" y="1582" font-size="14" letter-spacing="1" fill-opacity=".46">LEAST PRIVILEGE FIRST</text>
    </g>

    <line x1="64" y1="1700" x2="1136" y2="1700" stroke="#F2EFE9" stroke-opacity=".22"/>
    <text x="64" y="1752" font-size="17" letter-spacing="2" fill-opacity=".66">GITHUB.COM/ARKAMRASHED97/ARKOCLICK</text>
    <text x="1136" y="1752" font-size="17" letter-spacing="2" text-anchor="end" fill="#FF3B00">WINDOWS / RUST / WIN32</text>
    <text x="64" y="1794" font-size="14" letter-spacing="2" fill-opacity=".38">ARKO CLICK / OPEN SOURCE / MIT LICENSE / 2026</text>

    <!-- registration marks -->
    <g stroke="#F2EFE9" stroke-opacity=".4">
      <path d="M56 56h28M56 56v28M1144 56h-28M1144 56v28M56 1848h28M56 1848v-28M1144 1848h-28M1144 1848v-28"/>
    </g>
  </g>
</svg>
